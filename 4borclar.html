<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0f172a">
  <title>Borçlar & Alacaklar</title>
  <link rel="stylesheet" href="4shared.css">
  <style>
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --bg: #0f172a; --card-bg: #1e293b; --accent: #38bdf8; --primary-blue: #2563eb; --text: #f8fafc; --text-dim: #94a3b8; --border: #334155; --green: #10b981; --red: #f43f5e; --orange: #f59e0b; --purple: #a855f7; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    input, textarea, select { -webkit-user-select: text !important; user-select: text !important; -webkit-touch-callout: default !important; }
    body { background: var(--bg); color: var(--text); padding: var(--sat) 16px calc(28px + var(--sab)) 16px; min-height: 100vh; }
    body.modal-open { overflow: hidden !important; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; padding-top: 6px; }
    .page-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .filter-pill-switch { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; height: 36px; }
    .fp-btn { border: none; background: transparent; color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 0 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .fp-btn.active { background: var(--orange); color: #0f172a; }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--card-bg); padding: 14px 16px; border-radius: 12px; border-left: 4px solid transparent; cursor: pointer; }
    .summary-card.debt-net { grid-column: span 2; border-left-color: var(--accent); }
    .summary-card.debt-give { border-left-color: var(--red); }
    .summary-card.debt-get { border-left-color: var(--green); }
    .summary-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .summary-val { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .val-rem { font-size: 24px; }
    .masked { letter-spacing: 3px; color: var(--text-dim) !important; font-size: 18px; }

    .tabs-bar-wrapper { position: relative; margin-bottom: 16px; min-height: 42px; }
    .tabs { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 4px; gap: 4px; height: 42px; align-items: center; }
    .tab-btn { flex: 1; padding: 8px 0; text-align: center; border: none; background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600; border-radius: 7px; cursor: pointer; }
    .tab-btn#tab-debt-give.active { background: var(--red); color: #fff; }
    .tab-btn#tab-debt-get.active { background: var(--green); color: #0f172a; }
    .tab-btn#tab-debt-history.active { background: var(--purple); color: #fff; }
    .tab-search-trigger { width: 34px; height: 32px; border: none; background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tab-search-trigger svg { width: 16px; height: 16px; }

    .search-bar-inline { display: none; align-items: center; background: var(--card-bg); border: 1px solid var(--accent); border-radius: 10px; padding: 0 8px 0 10px; height: 42px; gap: 6px; }
    .search-bar-inline.active { display: flex; }
    .search-bar-inline input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; }
    .search-sum-badge { display: none; font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(56, 189, 248, 0.12); padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
    .search-clear-btn { background: rgba(255,255,255,0.08); border: none; color: var(--text-dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 12px; font-weight: bold; }

    .row-wrapper, .swipe-container { position: relative; margin-bottom: 8px; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
    .swipe-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: stretch; z-index: 1; border-radius: 0 10px 10px 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 0.15s ease; }
    .swipe-container.swiped .swipe-actions, .swipe-container.swiping .swipe-actions { opacity: 1; pointer-events: auto; }
    .swipe-btn { border: none; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 75px; height: 100%; }
    .swipe-btn.edit, .swipe-btn.close { background: var(--primary-blue); }
    .swipe-btn.pay { background: var(--orange); }
    .swipe-btn.delete, .swipe-btn.undo { background: var(--red); }

    .item-card { position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 2; transition: transform 0.2s ease-out; width: 100%; min-height: 58px; cursor: pointer; touch-action: pan-y; }
    .swipe-container.swiped .item-card, .swipe-container.swiping .item-card { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .item-left .name { font-weight: 600; font-size: 14px; }
    .item-left .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .item-right { font-weight: 700; font-size: 15px; text-align: right; }
    .item-right .sub-eur { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 2px; }

    .accordion-body { display: none; background: #131d31; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; padding: 12px 14px; z-index: 2; }
    .accordion-body.open { display: block; animation: fadeIn 0.2s ease; }
    .acc-row { display: grid; grid-template-columns: 105px 1fr auto; align-items: center; gap: 6px; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.08); }
    .acc-row:last-child { border-bottom: none; }
    .acc-date { color: var(--text-dim); white-space: nowrap; }
    .acc-note { color: var(--text); text-align: left; }
    .acc-amount { font-weight: 600; text-align: right; white-space: nowrap; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); align-items: flex-end; z-index: 999; }
    .modal-content { background: var(--card-bg); width: 100%; border-radius: 20px 20px 0 0; padding: 20px; padding-bottom: max(25px, var(--sab)); border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .type-switcher { display: flex; gap: 5px; margin-bottom: 14px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
    .type-btn { flex: 1; padding: 9px 0; border: none; background: transparent; color: var(--text-dim); font-size: 12px; font-weight: 600; border-radius: 7px; cursor: pointer; }
    .type-btn#btnTypeDebtGive.active { background: var(--red); color: #ffffff; }
    .type-btn#btnTypeDebtGet.active { background: var(--green); color: #0f172a; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 11px 12px; border-radius: 8px; font-size: 15px; outline: none; min-height: 44px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-submit { width: 100%; background: var(--orange); color: #0f172a; font-weight: bold; padding: 13px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
    .btn-cancel { width: 100%; background: #334155; color: var(--text); font-weight: 600; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="ios-top-strip"></div>

  <div class="header">
    <div class="page-title">Borçlar & Alacaklar</div>
    <div class="filter-pill-switch">
      <button type="button" class="fp-btn active" id="btnFilterActive" onclick="setArchiveMode(false)">Aktif</button>
      <button type="button" class="fp-btn" id="btnFilterArchive" onclick="setArchiveMode(true)">Arşiv</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-card debt-net" id="cardSummaryDebtNet" data-mask-key="debtNet" data-card-title="Net Borç / Alacak">
      <div class="summary-title" id="lblDebtNetTitle">NET BORÇ / ALACAK DURUMU</div>
      <div class="summary-val val-rem masked" id="debtNetVal">••••••</div>
    </div>
    <div class="summary-card debt-give" id="cardSummaryDebtGive" data-mask-key="debtGive" data-card-title="Borçlarım">
      <div class="summary-title" id="lblDebtGiveTitle">BORÇLARIM (ALDIKLARIM)</div>
      <div class="summary-val masked" id="debtGiveVal" style="color:var(--red);">••••••</div>
    </div>
    <div class="summary-card debt-get" id="cardSummaryDebtGet" data-mask-key="debtGet" data-card-title="Alacaklarım">
      <div class="summary-title" id="lblDebtGetTitle">ALACAKLARIM (VERDİKLERİM)</div>
      <div class="summary-val masked" id="debtGetVal" style="color:var(--green);">••••••</div>
    </div>
  </div>

  <div class="tabs-bar-wrapper">
    <div class="tabs" id="debtsTabsRow">
      <button class="tab-btn active" id="tab-debt-give" onclick="switchDebtTab('debt')">Borçlarım</button>
      <button class="tab-btn" id="tab-debt-get" onclick="switchDebtTab('credit')">Alacaklarım</button>
      <button class="tab-btn" id="tab-debt-history" onclick="switchDebtTab('history')">Geçmiş</button>
      <button type="button" class="tab-search-trigger" onclick="openSearchMode()" aria-label="Ara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </button>
    </div>

    <div class="search-bar-inline" id="debtsSearchBar">
      <span style="font-size:14px; opacity:0.8;">🔍</span>
      <input type="text" id="liveSearchInputDebts" placeholder="Kişi, tutar veya not ara..." autocomplete="off" oninput="handleSearchInput()">
      <span class="search-sum-badge" id="debtsSearchSumBadge">(0) €0,00</span>
      <button type="button" class="search-clear-btn" onclick="closeSearchMode()">✕</button>
    </div>
  </div>

  <div id="listContainer"></div>

  <!-- BORÇ EKLEME MODALI -->
  <div class="modal" id="modalDebt">
    <div class="modal-content">
      <h3 style="margin-bottom: 14px; font-size: 16px;">Yeni Borç / Alacak Ekle</h3>
      <div class="type-switcher">
        <button type="button" class="type-btn active" id="btnTypeDebtGive" onclick="setDebtModalType('debt')">Borç Aldım</button>
        <button type="button" class="type-btn" id="btnTypeDebtGet" onclick="setDebtModalType('credit')">Borç Verdim</button>
      </div>
      <div class="form-group">
        <label id="lblDebtPerson">Kimden Borç Aldım</label>
        <input type="text" id="mDebtPerson" placeholder="örn: Kardeşim, Ahmet">
      </div>
      <div class="form-group">
        <label>Tarih</label>
        <input type="date" id="mDebtDate">
      </div>
      <div class="form-group">
        <label>Toplam Tutar (€)</label>
        <input type="text" inputmode="decimal" id="mDebtAmount" placeholder="örn: 1.000,00 €">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-submit" onclick="submitDebtEntry()">Kaydet</button>
        <button type="button" class="btn-cancel" onclick="closeModal('modalDebt')">Kapat</button>
      </div>
    </div>
  </div>

  <!-- ÖDEME / TAHSİLAT MODALI -->
  <div class="modal" id="modalPayment">
    <div class="modal-content">
      <h3 style="margin-bottom: 14px; font-size: 16px;" id="lblPaymentTitle">Ödeme Ekle</h3>
      <input type="hidden" id="payDebtType">
      <input type="hidden" id="payRowIndex">
      <input type="hidden" id="payPersonName">
      <div class="form-group">
        <label id="lblPaymentDate">Ödeme Tarihi</label>
        <input type="date" id="payDate">
      </div>
      <div class="form-group">
        <label id="lblPaymentAmount">Ödenen Tutar (€)</label>
        <input type="text" inputmode="decimal" id="payAmount" placeholder="örn: 200,00 €">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-submit" id="btnPaymentSubmit" onclick="submitDebtPayment()">Kaydet</button>
        <button type="button" class="btn-cancel" onclick="closeModal('modalPayment')">Vazgeç</button>
      </div>
    </div>
  </div>

  <!-- KART AÇILIŞ GİZLİLİK AYARI MODALI -->
  <div class="modal" id="modalCardDefaultPrivacy" style="align-items:center; justify-content:center; z-index:9999;">
    <div class="modal-content" style="border-radius:14px; width:90%; max-width:320px; text-align:center;">
      <h3 id="lblPrivacyCardTitle" style="font-size:16px; margin:0 0 10px 0;">Kart Başlığı</h3>
      <p style="font-size:13px; color:var(--text-dim); margin:0 0 18px 0;">Bu kart açılışta nasıl başlasın?</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button type="button" onclick="saveCardDefaultPrivacy(false)" style="background:var(--green); color:#000; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">👁️ Açık Başlasın</button>
        <button type="button" onclick="saveCardDefaultPrivacy(true)" style="background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--border); padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">🔒 Gizli Başlasın (••••••)</button>
        <button type="button" onclick="closeModal('modalCardDefaultPrivacy')" style="background:transparent; border:none; color:var(--text-dim); font-size:12px; margin-top:4px; cursor:pointer; padding:6px;">Vazgeç</button>
      </div>
    </div>
  </div>

  <script src="4core.js"></script>
  <script>
    const _API_URL = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG.API_URL : "https://script.google.com/macros/s/AKfycbxwsVf8deHomi5jaNLfU86AkVbRQdXPNHuK8z9qiL1EGJanlSo_1e9BhQX0Kup7BdTb/exec";
    const _LS = (typeof AppStorage !== 'undefined') ? AppStorage : {
      getJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      setJSON(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} }
    };

    if (typeof AppFrame !== 'undefined') AppFrame.initEmbedInsets();

    let debtsData = _LS.getJSON('cache_debts_active', null);
    let isArchive = false;
    let activeDebtTab = 'debt';
    let modalDebtSelectedType = 'debt';
    let isSearchActiveDebts = false;
    let searchQueryDebts = "";
    let isSubmittingAction = false;

    const defaultPrivacy = { debtNet: true, debtGive: true, debtGet: true };
    let maskedState = { ...defaultPrivacy, ...(_LS.getJSON("app_card_privacy_defaults", {})) };
    let currentPrivacyEditKey = null;

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "trigger-add") openAddDebtModal();
    });

    function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split("T")[0]; }
    function isoToDMY(iso) { const p = String(iso || "").split("-"); return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : iso; }
    function toTs(dmy) { const p = String(dmy || "").split("."); return p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]).getTime() : 0; }
    function parseAmt(amt) {
      if (typeof amt === "number") return amt;
      let str = String(amt || "").replace(/[€₺\s]/g, "").trim();
      if (!str) return 0;
      if (str.includes(".") && str.includes(",")) {
        if (str.lastIndexOf(",") > str.lastIndexOf(".")) str = str.replace(/\./g, "").replace(",", ".");
        else str = str.replace(/,/g, "");
      } else if (str.includes(",")) str = str.replace(",", ".");
      return parseFloat(str) || 0;
    }
    function fmtAmt(val) {
      if (!val && val !== 0) return "€0,00";
      const s = String(val).trim();
      if (s.includes("€") || s.includes("₺")) return s;
      return "€" + parseAmt(s).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    window.onload = function() {
      document.getElementById('mDebtDate').value = todayISO();
      document.getElementById('payDate').value = todayISO();
      initCardPrivacyLongPress();
      if (debtsData) renderDebtsDashboard(debtsData);
      loadDebtsData();
    };

    function saveCardDefaultPrivacy(isMasked) {
      if (!currentPrivacyEditKey) return;
      maskedState[currentPrivacyEditKey] = isMasked;
      updateMaskedDisplay();
      const saved = _LS.getJSON("app_card_privacy_defaults", {});
      saved[currentPrivacyEditKey] = isMasked;
      _LS.setJSON("app_card_privacy_defaults", saved);
      closeModal('modalCardDefaultPrivacy');
    }

    function initCardPrivacyLongPress() {
      ['cardSummaryDebtNet', 'cardSummaryDebtGive', 'cardSummaryDebtGet'].forEach(id => {
        const card = document.getElementById(id);
        if (!card) return;
        const key = card.getAttribute('data-mask-key');
        const title = card.getAttribute('data-card-title') || 'Kart Ayarı';
        let pressTimer = null, isLongPress = false;
        const start = () => {
          isLongPress = false;
          pressTimer = setTimeout(() => {
            isLongPress = true;
            currentPrivacyEditKey = key;
            document.getElementById('lblPrivacyCardTitle').innerText = title;
            document.getElementById('modalCardDefaultPrivacy').style.display = 'flex';
          }, 500);
        };
        const cancel = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
        card.addEventListener('touchstart', start, { passive: true });
        card.addEventListener('touchend', cancel);
        card.addEventListener('touchmove', cancel, { passive: true });
        card.addEventListener('mousedown', start);
        card.addEventListener('mouseup', cancel);
        card.addEventListener('mouseleave', cancel);
        card.addEventListener('click', (e) => {
          if (isLongPress) { e.preventDefault(); e.stopPropagation(); return; }
          maskedState[key] = !maskedState[key];
          updateMaskedDisplay();
        });
      });
    }

    function calculateDurationText(startDateStr, endDateStr) {
      if (!startDateStr) return "";
      const sParts = startDateStr.toString().trim().split(".");
      if (sParts.length !== 3) return "";
      let start = new Date(parseInt(sParts[2]), parseInt(sParts[1]) - 1, parseInt(sParts[0]));
      let end = new Date();
      if (endDateStr) {
        const eParts = endDateStr.toString().trim().split(".");
        if (eParts.length === 3) end = new Date(parseInt(eParts[2]), parseInt(eParts[1]) - 1, parseInt(eParts[0]));
      }
      if (end < start) return "(0 gün)";
      let years = end.getFullYear() - start.getFullYear(), months = end.getMonth() - start.getMonth(), days = end.getDate() - start.getDate();
      if (days < 0) { months -= 1; days += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
      if (months < 0) { years -= 1; months += 12; }
      let totalMonths = years * 12 + months, parts = [];
      if (totalMonths > 0) parts.push(`${totalMonths} ay`);
      if (days > 0 || totalMonths === 0) parts.push(`${days} gün`);
      return `(${parts.join(" ")})`;
    }

    function setArchiveMode(archiveFlag) {
      isArchive = archiveFlag;
      document.getElementById('btnFilterActive').classList.toggle('active', !isArchive);
      document.getElementById('btnFilterArchive').classList.toggle('active', isArchive);
      loadDebtsData();
    }

    async function loadDebtsData() {
      try {
        const res = await fetch(`${_API_URL}?action=getDebtsData&archive=${isArchive}`);
        const data = await res.json();
        if (data) {
          debtsData = data;
          if (!isArchive) _LS.setJSON('cache_debts_active', data);
          renderDebtsDashboard(data);
        }
      } catch (e) {}
    }

    function renderDebtsDashboard(data) {
      if (!data) return;
      document.getElementById('lblDebtNetTitle').innerHTML = isArchive ? "NET KAPANAN DURUM" : "NET BORÇ / ALACAK DURUMU";
      document.getElementById('lblDebtGiveTitle').innerHTML = isArchive ? "KAPATTIĞIM BORÇLAR" : "BORÇLARIM (ALDIKLARIM)";
      document.getElementById('lblDebtGetTitle').innerHTML = isArchive ? "TAHSİL ETTİĞİM ALACAKLAR" : "ALACAKLARIM (VERDİKLERİM)";
      updateMaskedDisplay();
      renderDebtsList();
    }

    function switchDebtTab(tab) {
      activeDebtTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const map = { debt: 'tab-debt-give', credit: 'tab-debt-get', history: 'tab-debt-history' };
      document.getElementById(map[tab])?.classList.add('active');
      renderDebtsList();
    }

    function openSearchMode() {
      isSearchActiveDebts = true;
      document.getElementById('debtsTabsRow').style.display = 'none';
      document.getElementById('debtsSearchBar').classList.add('active');
      const input = document.getElementById('liveSearchInputDebts');
      input.value = searchQueryDebts;
      setTimeout(() => input.focus(), 100);
      renderDebtsList();
    }

    function closeSearchMode() {
      isSearchActiveDebts = false;
      searchQueryDebts = "";
      document.getElementById('liveSearchInputDebts').value = "";
      document.getElementById('debtsSearchSumBadge').style.display = "none";
      document.getElementById('debtsSearchBar').classList.remove('active');
      document.getElementById('debtsTabsRow').style.display = 'flex';
      renderDebtsList();
    }

    function handleSearchInput() {
      searchQueryDebts = document.getElementById('liveSearchInputDebts').value.trim().toLowerCase();
      renderDebtsList();
    }

    function renderDebtsList() {
      const container = document.getElementById('listContainer');
      const badge = document.getElementById('debtsSearchSumBadge');
      container.innerHTML = '';
      if (!debtsData) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-dim);">Yükleniyor...</div>';
        return;
      }

      if (activeDebtTab === 'history') {
        let history = [...(debtsData.history || [])];
        if (isSearchActiveDebts && searchQueryDebts) {
          history = history.filter(item => `${item.person || ''} ${item.note || ''} ${item.amount || ''} ${item.date || ''}`.toLowerCase().includes(searchQueryDebts));
          let totalSum = history.reduce((acc, it) => acc + parseAmt(it.amount || 0), 0);
          badge.innerText = `(${history.length}) €${totalSum.toLocaleString("de-DE", { minimumFractionDigits: 2 })}`;
          badge.style.display = "inline-block";
        } else badge.style.display = "none";

        history.sort((a, b) => toTs(b.date) - toTs(a.date));
        if (!history.length) {
          container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-dim)">Kayıt bulunamadı.</div>`;
          return;
        }
        history.forEach(item => {
          let itemColor = item.note.includes("Borç Alma") ? 'var(--red)' : (item.note.includes("Borç Verme") ? 'var(--accent)' : 'var(--green)');
          const wrapper = document.createElement('div');
          wrapper.className = 'row-wrapper';
          wrapper.innerHTML = `
            <div class="item-card">
              <div class="item-left">
                <div class="name">${esc(item.person)}</div>
                <div class="sub">${esc(item.date)} • ${esc(item.note)}</div>
              </div>
              <div class="item-right" style="color:${itemColor}">${fmtAmt(item.amount)}</div>
            </div>
          `;
          container.appendChild(wrapper);
        });
        return;
      }

      let rawItems = (activeDebtTab === 'debt') ? (debtsData.debts || []) : (debtsData.credits || []);
      if (isSearchActiveDebts && searchQueryDebts) {
        rawItems = rawItems.filter(item => `${item.person || ''} ${item.totalAmount || ''} ${item.remainingAmount || ''} ${item.date || ''}`.toLowerCase().includes(searchQueryDebts));
        let totalSum = rawItems.reduce((acc, it) => acc + parseAmt(isArchive ? it.totalAmount : it.remainingAmount), 0);
        badge.innerText = `(${rawItems.length}) €${totalSum.toLocaleString("de-DE", { minimumFractionDigits: 2 })}`;
        badge.style.display = "inline-block";
      } else badge.style.display = "none";

      if (!rawItems.length) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-dim)">Kayıt bulunamadı.</div>`;
        return;
      }

      rawItems.forEach(item => {
        const total = fmtAmt(item.totalAmount);
        const rem = fmtAmt(item.remainingAmount);
        const paid = fmtAmt(item.paidAmount);
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-container';
        wrapper.id = `debt-row-${item.rowIndex}`;

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'swipe-actions';
        if (!isArchive) {
          actionsDiv.style.width = '225px';
          actionsDiv.innerHTML = `
            <button class="swipe-btn pay" onclick="openPaymentModal('${activeDebtTab}', ${item.rowIndex}, '${esc(item.person)}')">Ödeme</button>
            <button class="swipe-btn close" onclick="handleDebtArchive('${activeDebtTab}', ${item.rowIndex})">Kapat</button>
            <button class="swipe-btn delete" onclick="handleDebtDelete('${activeDebtTab}', ${item.rowIndex})">Sil</button>
          `;
        } else {
          actionsDiv.style.width = '75px';
          actionsDiv.innerHTML = `<button class="swipe-btn delete" onclick="handleDebtDelete('${activeDebtTab}', ${item.rowIndex})">Sil</button>`;
        }

        let initialLabel = (activeDebtTab === 'debt') ? 'Borç Alındı' : 'Borç Verildi';
        let initialColor = (activeDebtTab === 'debt') ? 'var(--red)' : 'var(--green)';
        let paymentColor = (activeDebtTab === 'debt') ? 'var(--green)' : 'var(--red)';

        let histHtml = `
          <div class="acc-row">
            <span class="acc-date">📅 ${item.date}</span>
            <span class="acc-note">${initialLabel}</span>
            <span class="acc-amount" style="color: ${initialColor}">${total}</span>
          </div>
        `;
        if (item.history && item.history.length > 0) {
          item.history.filter(h => h.note.includes("Geri Ödeme")).forEach(h => {
            histHtml += `
              <div class="acc-row">
                <span class="acc-date">📅 ${h.date}</span>
                <span class="acc-note">Geri Ödeme</span>
                <span class="acc-amount" style="color: ${paymentColor}">${fmtAmt(h.amount)}</span>
              </div>
            `;
          });
        }
        let archiveCloseHtml = (isArchive && item.closeDate) ? `
          <div class="acc-row" style="color: var(--text-dim); border-top: 1px dashed rgba(255,255,255,0.08); margin-top: 4px; padding-top: 4px;">
            <span class="acc-date">📅 ${item.closeDate}</span>
            <span class="acc-note" style="color: var(--text-dim)">Kapanma Tarihi</span>
            <span class="acc-amount" style="color: var(--text-dim)">Kapandı</span>
          </div>
        ` : '';

        let durationText = isArchive ? calculateDurationText(item.date, item.closeDate) : calculateDurationText(item.date, null);

        const cardEl = document.createElement('div');
        cardEl.className = 'item-card';
        cardEl.innerHTML = `
          <div class="item-left">
            <div class="name"><span style="font-size:10px; color:var(--text-dim); margin-right:4px;">▼</span>${esc(item.person)} <span style="font-weight:normal; font-size:12px; color:var(--text-dim);">&nbsp;/&nbsp;${durationText}</span></div>
            <div class="sub">${isArchive ? `${item.date} • Kapanış: ${item.closeDate}` : `${item.date} • ${activeDebtTab === 'debt' ? 'Alınan' : 'Verilen'}: ${total}`}</div>
          </div>
          <div class="item-right" style="color:${activeDebtTab === 'debt' ? 'var(--red)' : 'var(--green)'}">
            ${isArchive ? total : rem}
            <div class="sub-eur">${isArchive ? 'Kapandı' : `${activeDebtTab === 'debt' ? 'Ödenen' : 'Alınan'}: ${paid}`}</div>
          </div>
        `;

        const accBody = document.createElement('div');
        accBody.className = 'accordion-body';
        accBody.id = `acc-${item.rowIndex}`;
        accBody.innerHTML = `
          <div style="font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase;">İşlem Geçmişi</div>
          ${histHtml}
          ${archiveCloseHtml}
          <div class="acc-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-weight: bold;">
            <span style="grid-column: span 2;">${isArchive ? 'Kapanan Tutar' : 'Kalan Tutar'}</span>
            <span class="acc-amount" style="color:${activeDebtTab === 'debt' ? 'var(--red)' : 'var(--green)'}">${isArchive ? total : rem}</span>
          </div>
        `;

        wrapper.appendChild(actionsDiv);
        wrapper.appendChild(cardEl);
        wrapper.appendChild(accBody);
        attachSwipeEvents(cardEl, wrapper, `acc-${item.rowIndex}`);
        container.appendChild(wrapper);
      });
    }

    function setDebtModalType(type) {
      modalDebtSelectedType = type;
      document.querySelectorAll('#modalDebt .type-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(type === 'debt' ? 'btnTypeDebtGive' : 'btnTypeDebtGet').classList.add('active');
      document.getElementById('lblDebtPerson').innerText = type === 'debt' ? 'Kimden Borç Aldım' : 'Kime Borç Verdim';
    }

    function openPaymentModal(debtType, rowIndex, personName) {
      resetCurrentSwipe();
      document.getElementById('payDebtType').value = debtType;
      document.getElementById('payRowIndex').value = rowIndex;
      document.getElementById('payPersonName').value = personName;
      document.getElementById('lblPaymentTitle').innerText = debtType === 'debt' ? `${personName} İçin Ödeme Ekle` : `${personName} İçin Tahsilat Ekle`;
      document.getElementById('payDate').value = todayISO();
      document.getElementById('payAmount').value = '';
      openModalWithScrollLock('modalPayment');
    }

    async function submitDebtEntry() {
      if (isSubmittingAction) return;
      isSubmittingAction = true;
      try {
        const payload = {
          person: document.getElementById('mDebtPerson').value,
          date: isoToDMY(document.getElementById('mDebtDate').value),
          amount: document.getElementById('mDebtAmount').value,
          paid: "0"
        };
        closeModal('modalDebt');
        await fetch(_API_URL, { method: 'POST', body: JSON.stringify({ action: 'addDebt', debtType: modalDebtSelectedType, payload }) });
        loadDebtsData();
      } finally { isSubmittingAction = false; }
    }

    async function submitDebtPayment() {
      const amount = document.getElementById('payAmount').value;
      if (!amount || isSubmittingAction) return;
      isSubmittingAction = true;
      try {
        closeModal('modalPayment');
        await fetch(_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'updateDebtPayment',
            debtType: document.getElementById('payDebtType').value,
            rowIndex: document.getElementById('payRowIndex').value,
            amount,
            date: isoToDMY(document.getElementById('payDate').value),
            person: document.getElementById('payPersonName').value
          })
        });
        loadDebtsData();
      } finally { isSubmittingAction = false; }
    }

    async function handleDebtArchive(debtType, rowIndex) {
      if (!confirm("Arşive taşınsın mı?")) { resetCurrentSwipe(); return; }
      document.getElementById(`debt-row-${rowIndex}`)?.remove();
      await fetch(_API_URL, { method: 'POST', body: JSON.stringify({ action: 'archiveDebt', debtType, rowIndex }) });
      loadDebtsData();
    }

    async function handleDebtDelete(debtType, rowIndex) {
      if (!confirm("Kalıcı olarak silinsin mi?")) { resetCurrentSwipe(); return; }
      document.getElementById(`debt-row-${rowIndex}`)?.remove();
      await fetch(_API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteDebt', debtType, rowIndex, isArchive }) });
      loadDebtsData();
    }

    function updateMaskedDisplay() {
      if (!debtsData) return;
      const netEl = document.getElementById('debtNetVal');
      if (maskedState.debtNet) { netEl.innerText = "••••••"; netEl.classList.add('masked'); netEl.style.color = ""; }
      else { netEl.innerText = debtsData.netBalance; netEl.classList.remove('masked'); netEl.style.color = (debtsData.netBalance || "").includes("-") ? "var(--red)" : "var(--green)"; }
      const giveEl = document.getElementById('debtGiveVal');
      giveEl.innerText = maskedState.debtGive ? "••••••" : debtsData.totalDebt; giveEl.classList.toggle('masked', maskedState.debtGive);
      const getEl = document.getElementById('debtGetVal');
      getEl.innerText = maskedState.debtGet ? "••••••" : debtsData.totalCredit; getEl.classList.toggle('masked', maskedState.debtGet);
    }

    let currentlySwiped = null, currentlySwipedContainer = null;
    function attachSwipeEvents(card, container, accordionId) {
      let startX = 0, startY = 0, currentX = 0, currentY = 0, isHorizontal = false, isVertical = false;
      card.addEventListener('touchstart', e => {
        if (currentlySwiped && currentlySwiped !== card) resetCurrentSwipe();
        startX = e.touches[0].clientX; startY = e.touches[0].clientY; currentX = startX; currentY = startY; isHorizontal = false; isVertical = false;
      }, { passive: true });
      card.addEventListener('touchmove', e => {
        currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
        let diffX = currentX - startX, diffY = currentY - startY;
        if (!isHorizontal && !isVertical) {
          if (Math.abs(diffX) > 6 && Math.abs(diffX) > Math.abs(diffY)) isHorizontal = true;
          else if (Math.abs(diffY) > 6) isVertical = true;
        }
        if (isHorizontal) {
          const actionsEl = container.querySelector('.swipe-actions');
          const maxSnap = actionsEl ? actionsEl.offsetWidth : 75;
          if (diffX < 0 && diffX > -(maxSnap + 25)) { container.classList.add('swiping'); card.style.transform = `translateX(${diffX}px)`; }
        }
      }, { passive: true });
      card.addEventListener('touchend', () => {
        let diffX = currentX - startX, diffY = currentY - startY;
        if (Math.abs(diffX) < 8 && Math.abs(diffY) < 8) {
          if (currentlySwiped === card) {
            resetCurrentSwipe();
          } else if (accordionId) {
            const acc = document.getElementById(accordionId);
            if (acc) {
              const isOpen = acc.classList.contains('open');
              document.querySelectorAll('.accordion-body').forEach(el => el.classList.remove('open'));
              if (!isOpen) acc.classList.add('open');
            }
          }
          return;
        }
        if (isHorizontal) {
          const actionsEl = container.querySelector('.swipe-actions');
          const snapOffset = actionsEl ? -actionsEl.offsetWidth : -75;
          if (diffX < -35) {
            if (accordionId) document.getElementById(accordionId)?.classList.remove('open');
            card.style.transform = `translateX(${snapOffset}px)`;
            container.classList.add('swiped'); container.classList.remove('swiping');
            currentlySwiped = card; currentlySwipedContainer = container;
          } else { card.style.transform = 'translateX(0px)'; container.classList.remove('swiped', 'swiping'); }
        }
      });
    }
    function resetCurrentSwipe() {
      if (currentlySwiped) {
        currentlySwiped.style.transform = 'translateX(0px)';
        if (currentlySwipedContainer) currentlySwipedContainer.classList.remove('swiped');
        currentlySwiped = null; currentlySwipedContainer = null;
      }
    }

    function openModalWithScrollLock(id) { document.body.classList.add('modal-open'); document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; document.body.classList.remove('modal-open'); }
  </script>
</body>
</html>
