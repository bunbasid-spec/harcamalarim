  <style>
    /* iOS Safari alt ve üst tüm sistem boşluklarını yok eden kural */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important; /* Dinamik ekran boyutu */
      overflow: hidden !important;
      background-color: #0f172a !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      -webkit-user-select: none;
      user-select: none;
    }
    
    iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      outline: none !important;
      display: block !important;
      background-color: #0f172a !important;
    }
  </style>
