<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bütçe & Harcama Takibi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --accent-card: #06b6d4;
      --accent-manual: #f59e0b;
      --accent-income: #10b981;
      --accent-tr: #a855f7;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 90px; }
    header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    select.sheet-select { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-weight: 600; outline: none; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--card-bg); padding: 14px; border-radius: 12px; border-left: 4px solid transparent; }
    .summary-card.rem { grid-column: span 2; border-left-color: var(--primary); }
    .summary-card.card-exp { border-left-color: var(--accent-card); }
    .summary-card.manual-exp { border-left-color: var(--accent-manual); }
    .summary-card.tr-exp { border-left-color: var(--accent-tr); }
    .summary-card.income { border-left-color: var(--accent-income); }
    .summary-title { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-val { font-size: 1.25rem; font-weight: 700; }
    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
    .nav-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 10px 4px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .nav-btn.active.tab-card { background: var(--accent-card); color: #000; border-color: var(--accent-card); }
    .nav-btn.active.tab-manual { background: var(--accent-manual); color: #000; border-color: var(--accent-manual); }
    .nav-btn.active.tab-tr { background: var(--accent-tr); color: #fff; border-color: var(--accent-tr); }
    .nav-btn.active.tab-income { background: var(--accent-income); color: #000; border-color: var(--accent-income); }
    .items-list { display: flex; flex-direction: column; gap: 8px; }
    .item-card { background: var(--card-bg); padding: 12px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .item-info { display: flex; flex-direction: column; gap: 3px; }
    .item-title { font-weight: 600; font-size: 0.95rem; }
    .item-sub { font-size: 0.75rem; color: var(--text-sub); }
    .item-amount { font-weight: 700; font-size: 1rem; text-align: right; }
    .item-eur-sub { font-size: 0.75rem; color: var(--accent-tr); font-weight: 500; }
    .del-btn { background: transparent; border: none; color: var(--danger); font-size: 1.1rem; margin-left: 12px; cursor: pointer; padding: 4px; }
    .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 400px; padding: 20px; border-radius: 14px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .modal-btn.cancel { background: var(--border); color: var(--text-main); }
    .modal-btn.save { background: var(--primary); color: #fff; }
    .empty-state { text-align: center; color: var(--text-sub); padding: 30px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div style="font-weight:700; font-size:1.1rem;">💰 Bütçe Takip</div>
    <select id="sheetSelect" class="sheet-select" onchange="changeSheet()"></select>
  </header>

  <div class="container">
    <div class="summary-grid">
      <div class="summary-card rem">
        <div class="summary-title">Kalan Bakiye</div>
        <div class="summary-val" id="remVal">...</div>
      </div>
      <div class="summary-card card-exp">
        <div class="summary-title">Kart Harcaması</div>
        <div class="summary-val" id="cardVal">...</div>
      </div>
      <div class="summary-card manual-exp">
        <div class="summary-title">Diğer Harcamalar</div>
        <div class="summary-val" id="manualVal">...</div>
      </div>
      <div class="summary-card tr-exp">
        <div class="summary-title">TR Ödemeleri (€)</div>
        <div class="summary-val" id="trVal">...</div>
      </div>
      <div class="summary-card income">
        <div class="summary-title">Gelirler</div>
        <div class="summary-val" id="incomeVal">...</div>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active tab-card" onclick="setTab('card')">Kart</button>
      <button class="nav-btn tab-manual" onclick="setTab('manual')">Diğer</button>
      <button class="nav-btn tab-tr" onclick="setTab('tr')">TR</button>
      <button class="nav-btn tab-income" onclick="setTab('income')">Gelir</button>
    </div>

    <div id="itemsList" class="items-list"></div>
  </div>

  <button class="fab" onclick="openModal()">+</button>

  <!-- Ekleme Modalı -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Yeni Kayıt</div>
      <div class="form-group">
        <label>İşlem Türü</label>
        <select id="entryType" onchange="onTypeChange()">
          <option value="manual">Diğer Harcama (Nakit/EFT)</option>
          <option value="tr">TR Ödemesi (₺)</option>
          <option value="income">Gelir</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tarih</label>
        <input type="date" id="entryDate">
      </div>
      <div class="form-group">
        <label id="amountLabel">Tutar (€)</label>
        <input type="number" step="0.01" id="entryAmount" placeholder="0.00">
      </div>
      <div class="form-group">
        <label id="merchantLabel">Açıklama / Harcama Yeri</label>
        <input type="text" id="entryMerchant" placeholder="örn: Market, Kira">
      </div>
      <div class="form-group" id="cardGroup">
        <label>Kart / Ödeme Kanalı</label>
        <input type="text" id="entryCard" placeholder="örn: Nakit, Banka">
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">İptal</button>
        <button class="modal-btn save" id="saveBtn" onclick="saveEntry()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    let appData = null;
    let currentTab = 'card';
    const API_URL = 'https://script.google.com/macros/s/AKfycbxwsVf8deHomi5jaNLfU86AkVbRQdXPNHuK8z9qiL1EGJanlSo_1e9BhQX0Kup7BdTb/exec'; // https://script.google.com/macros/s/.../exec

    window.onload = () => {
      loadInitialData();
      document.getElementById('entryDate').valueAsDate = new Date();
    };

    function loadInitialData() {
      fetch(`${API_URL}?action=getInitialData`)
        .then(res => res.json())
        .then(data => {
          appData = data;
          populateSheets(data.sheets, data.activeSheet);
          renderDashboard(data.dashboard);
        });
    }

    function changeSheet() {
      const selected = document.getElementById('sheetSelect').value;
      fetch(`${API_URL}?action=getDashboardData&sheet=${encodeURIComponent(selected)}`)
        .then(res => res.json())
        .then(dash => renderDashboard(dash));
    }

    function populateSheets(sheets, active) {
      const sel = document.getElementById('sheetSelect');
      sel.innerHTML = '';
      sheets.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (s === active) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function renderDashboard(dash) {
      if (!dash) return;
      document.getElementById('remVal').textContent = dash.remaining;
      document.getElementById('cardVal').textContent = dash.cardTotal;
      document.getElementById('manualVal').textContent = dash.manualTotal;
      document.getElementById('trVal').textContent = dash.trTotal || '€0,00';
      document.getElementById('incomeVal').textContent = dash.incomeTotal;
      renderList(dash);
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-${tab}`).classList.add('active');
      if (appData && appData.dashboard) {
        changeSheet();
      }
    }

    function renderList(dash) {
      const container = document.getElementById('itemsList');
      container.innerHTML = '';
      let items = [];

      if (currentTab === 'card') items = dash.cardItems || [];
      else if (currentTab === 'manual') items = dash.manualItems || [];
      else if (currentTab === 'tr') items = dash.trItems || [];
      else if (currentTab === 'income') items = dash.incomeItems || [];

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">Bu sekmede henüz kayıt yok.</div>';
        return;
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';

        let subText = item.date;
        if (item.card) subText += ` • ${item.card}`;
        if (currentTab === 'tr' && item.rate) subText += ` • Kur: ${item.rate}`;

        let eurSub = '';
        if (currentTab === 'tr' && item.eurAmount) {
          eurSub = `<div class="item-eur-sub">${item.eurAmount}</div>`;
        }

        let deleteBtn = '';
        if (currentTab !== 'card') {
          deleteBtn = `<button class="del-btn" onclick="deleteEntry('${currentTab}', ${item.rowIndex})">✕</button>`;
        }

        div.innerHTML = `
          <div class="item-info">
            <div class="item-title">${item.merchant || 'Açıklamasız'}</div>
            <div class="item-sub">${subText}</div>
          </div>
          <div style="display:flex; align-items:center;">
            <div style="text-align:right;">
              <div class="item-amount">${item.amount}</div>
              ${eurSub}
            </div>
            ${deleteBtn}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function onTypeChange() {
      const type = document.getElementById('entryType').value;
      const cardGroup = document.getElementById('cardGroup');
      const merchantInput = document.getElementById('entryMerchant');
      const amountLabel = document.getElementById('amountLabel');

      if (type === 'income') {
        cardGroup.style.display = 'none';
        merchantInput.placeholder = 'örn: Maaş, Prim vb.';
        amountLabel.textContent = 'Tutar (€)';
      } else if (type === 'tr') {
        cardGroup.style.display = 'none';
        merchantInput.placeholder = 'örn: Spotify, Enpara';
        amountLabel.textContent = 'Tutar (₺)';
      } else {
        cardGroup.style.display = 'block';
        merchantInput.placeholder = 'örn: Market, Akaryakıt';
        amountLabel.textContent = 'Tutar (€)';
      }
    }

    function openModal() {
      document.getElementById('modal').style.display = 'flex';
      onTypeChange();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function saveEntry() {
      const type = document.getElementById('entryType').value;
      const date = document.getElementById('entryDate').value;
      const amount = document.getElementById('entryAmount').value;
      const merchant = document.getElementById('entryMerchant').value;
      const card = document.getElementById('entryCard').value;
      const sheet = document.getElementById('sheetSelect').value;

      if (!amount) return alert('Lütfen tutar giriniz.');

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = 'Kaydediliyor...';
      saveBtn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'addEntry',
          sheet: sheet,
          type: type,
          payload: { date, amount, merchant, card }
        })
      })
      .then(res => res.json())
      .then(() => {
        saveBtn.textContent = 'Kaydet';
        saveBtn.disabled = false;
        closeModal();
        changeSheet();
      });
    }

    function deleteEntry(type, rowIndex) {
      if (!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
      const sheet = document.getElementById('sheetSelect').value;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'deleteEntry',
          sheet: sheet,
          type: type,
          rowIndex: rowIndex
        })
      })
      .then(res => res.json())
      .then(() => changeSheet());
    }
  </script>
</body>
</html>
