<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-title" content="Harcama Takip">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">

  <title>Harcama & Borç Takip</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --primary-blue: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --green: #10b981;
      --red: #f43f5e;
      --orange: #f59e0b;
      --purple: #a855f7;
    }
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    html {
      background-color: var(--bg);
      margin: 0;
      padding: 0;
    }
    
    body { 
      background-color: var(--bg);
      color: var(--text); 
      padding-top: max(44px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 24px;
      margin: 0;
      min-height: 100vh;
    }

    #appContent {
      transition: transform 0.2s ease-out;
      will-change: transform;
    }

    .status-bar-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: max(44px, env(safe-area-inset-top));
      background-color: var(--bg);
      z-index: 150;
      pointer-events: none;
    }

    #pullIndicator {
      position: fixed;
      top: calc(max(44px, env(safe-area-inset-top)) + 15px);
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: var(--card-bg);
      border: 2px solid var(--accent);
      color: var(--accent);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      z-index: 200;
      opacity: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
    }
    .rotating { animation: spin 0.7s linear infinite !important; }
    @keyframes spin { 
      0% { transform: translateX(-50%) rotate(0deg); }
      100% { transform: translateX(-50%) rotate(360deg); }
    }

    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
      padding-top: 6px;
    }

    /* Sol Üst İki Modül Butonları */
    .module-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .mod-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mod-btn.active {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(56, 189, 248, 0.3);
    }

    select.sheet-select { 
      background: var(--card-bg); 
      color: var(--text); 
      border: 1px solid var(--border); 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 14px; 
      outline: none;
    }

    /* Kart Izgaraları */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    
    .summary-card { 
      background: var(--card-bg); 
      padding: 14px 16px; 
      border-radius: 12px; 
      border-left: 4px solid transparent; 
    }
    
    .summary-card.rem { grid-column: span 2; border-left-color: var(--primary-blue); }
    .summary-card.card-exp { border-left-color: var(--accent); }
    .summary-card.manual-exp { border-left-color: var(--orange); }
    .summary-card.tr-exp { border-left-color: var(--purple); }
    .summary-card.income { border-left-color: var(--green); }
    
    /* Borç Modülü Kart Renkleri */
    .summary-card.debt-net { grid-column: span 2; border-left-color: var(--accent); }
    .summary-card.debt-give { border-left-color: var(--red); }
    .summary-card.debt-get { border-left-color: var(--green); }

    .summary-card.clickable { cursor: pointer; }
    .summary-card.clickable:active { opacity: 0.8; transform: scale(0.98); transition: transform 0.1s; }
    
    .summary-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .summary-val { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px; }
    
    .val-rem { font-size: 24px; }
    .val-card { color: var(--text); }
    .val-manual { color: var(--text); }
    .val-tr { color: var(--text); }
    .val-inc { color: var(--text); }
    .masked { letter-spacing: 3px; color: var(--text-dim) !important; font-size: 18px; }

    /* Sekmeler */
    .tabs { 
      display: flex; 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 4px; 
      margin-bottom: 16px; 
      gap: 4px;
    }
    .tab-btn { 
      flex: 1; 
      padding: 8px 0; 
      text-align: center; 
      border: none; 
      background: transparent; 
      color: var(--text-dim); 
      font-size: 13px; 
      font-weight: 600; 
      border-radius: 7px; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    
    .tab-btn#tab-card.active { background: var(--accent); color: #0f172a; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35); }
    .tab-btn#tab-manual.active { background: var(--orange); color: #0f172a; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35); }
    .tab-btn#tab-tr.active { background: var(--purple); color: #ffffff; box-shadow: 0 2px 8px rgba(168, 85, 247, 0.35); }
    .tab-btn#tab-income.active { background: var(--green); color: #0f172a; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35); }
    
    .tab-btn#tab-debt-give.active { background: var(--red); color: #fff; box-shadow: 0 2px 8px rgba(244, 63, 94, 0.35); }
    .tab-btn#tab-debt-get.active { background: var(--green); color: #0f172a; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35); }

    .swipe-container {
      position: relative;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 10px;
      background: var(--red);
      transition: all 0.25s ease;
    }
    .swipe-actions {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    .swipe-container.swiping .swipe-actions,
    .swipe-container.swiped .swipe-actions {
      opacity: 1;
    }

    .swipe-btn {
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 0 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swipe-btn.pay { background: var(--orange); }
    .swipe-btn.close { background: var(--primary-blue); }
    .swipe-btn.delete { background: var(--red); }

    .item-card { 
      position: relative; 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 2; 
      transition: transform 0.2s ease-out; 
      width: 100%; 
    }
    .item-left .name { font-weight: 600; font-size: 14px; }
    .item-left .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .item-right { font-weight: 700; font-size: 15px; text-align: right; }
    .item-right .sub-eur { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 2px; }

    .fab { 
      position: fixed; 
      bottom: 20px; 
      right: 20px; 
      background: var(--accent); 
      color: #0f172a; 
      width: 70px; 
      height: 70px; 
      border-radius: 50%; 
      border: none; 
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 50; 
      transition: transform 0.15s ease; 
    }
    .fab span { display: block; font-size: 40px; font-weight: 400; line-height: 1; margin-top: -3px; }
    .fab:active { transform: scale(0.92); opacity: 0.9; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: flex-end; z-index: 999; }
    .modal-content { 
      background: var(--card-bg); 
      width: 100%; 
      border-radius: 20px 20px 0 0; 
      padding: 20px; 
      padding-bottom: max(25px, env(safe-area-inset-bottom)); 
      border-top: 1px solid var(--border); 
      box-sizing: border-box;
    }
    
    .type-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .type-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .type-btn#btnTypeManual.active { background: var(--orange); color: #0f172a; }
    .type-btn#btnTypeTR.active { background: var(--purple); color: #ffffff; }
    .type-btn#btnTypeIncome.active { background: var(--green); color: #0f172a; }
    
    .type-btn#btnTypeDebtGive.active { background: var(--red); color: #ffffff; }
    .type-btn#btnTypeDebtGet.active { background: var(--green); color: #0f172a; }

    /* Form Elemanları ve Tarih Alanı Taşma Koruması */
    .form-group { 
      margin-bottom: 12px; 
      width: 100%; 
      box-sizing: border-box;
    }
    .form-group label { 
      display: block; 
      font-size: 12px; 
      color: var(--text-dim); 
      margin-bottom: 4px; 
    }
    
    .form-group input { 
      width: 100%; 
      max-width: 100%;
      min-width: 0;
      background: var(--bg); 
      border: 1px solid var(--border); 
      color: #fff; 
      padding: 11px 12px; 
      border-radius: 8px; 
      font-size: 15px; 
      outline: none;
      box-sizing: border-box;
      display: block;
      -webkit-appearance: none;
      appearance: none;
    }
    .form-group input[type="date"] {
      min-height: 44px;
      line-height: normal;
    }
    .form-group input:focus { border-color: var(--accent); }

    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-submit { 
      width: 100%;
      background: var(--accent); 
      color: #0f172a; 
      font-weight: bold; 
      padding: 13px; 
      border-radius: 10px; 
      border: none; 
      font-size: 15px; 
      cursor: pointer; 
    }
    .btn-cancel { 
      width: 100%;
      background: #334155; 
      color: var(--text); 
      font-weight: 600; 
      padding: 12px; 
      border-radius: 10px; 
      border: 1px solid var(--border); 
      font-size: 15px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <div class="status-bar-shield"></div>
  <div id="pullIndicator">↓</div>

  <div id="appContent">
    <div class="header">
      <!-- Sol Üst Modül Seçici -->
      <div class="module-switcher">
        <button class="mod-btn active" id="modBudget" onclick="switchModule('budget')">Bütçe</button>
        <button class="mod-btn" id="modDebts" onclick="switchModule('debts')">Borçlar</button>
      </div>
      
      <!-- Sağ Üst Seçici -->
      <select id="sheetSelect" class="sheet-select" onchange="onFilterChange()"></select>
    </div>

    <!-- 1. BÜTÇE MODÜLÜ GÖRÜNÜMÜ -->
    <div id="viewBudget">
      <div class="summary-grid">
        <div class="summary-card rem clickable" onclick="toggleMask('rem')">
          <div class="summary-title">Kalan Bakiye</div>
          <div class="summary-val val-rem masked" id="remVal">••••••</div>
        </div>
        <div class="summary-card card-exp">
          <div class="summary-title">Kart Harcaması</div>
          <div class="summary-val val-card" id="cardVal">...</div>
        </div>
        <div class="summary-card manual-exp clickable" onclick="toggleMask('manual')">
          <div class="summary-title">Diğer Harcamalar</div>
          <div class="summary-val val-manual masked" id="manualVal">••••••</div>
        </div>
        <div class="summary-card tr-exp clickable" onclick="toggleMask('tr')">
          <div class="summary-title">TR Ödemeleri (€)</div>
          <div class="summary-val val-tr masked" id="trVal">••••••</div>
        </div>
        <div class="summary-card income clickable" onclick="toggleMask('inc')">
          <div class="summary-title">Gelirler</div>
          <div class="summary-val val-inc masked" id="incVal">••••••</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-card" onclick="switchBudgetTab('card')">Kart</button>
        <button class="tab-btn" id="tab-manual" onclick="switchBudgetTab('manual')">Diğer</button>
        <button class="tab-btn" id="tab-tr" onclick="switchBudgetTab('tr')">TR</button>
        <button class="tab-btn" id="tab-income" onclick="switchBudgetTab('income')">Gelir</button>
      </div>
    </div>

    <!-- 2. BORÇLAR MODÜLÜ GÖRÜNÜMÜ -->
    <div id="viewDebts" style="display: none;">
      <div class="summary-grid">
        <div class="summary-card debt-net clickable" onclick="toggleMask('debtNet')">
          <div class="summary-title">Net Borç / Alacak Durumu</div>
          <div class="summary-val val-rem masked" id="debtNetVal">••••••</div>
        </div>
        <div class="summary-card debt-give clickable" onclick="toggleMask('debtGive')">
          <div class="summary-title">Borçlarım (Aldıklarım)</div>
          <div class="summary-val masked" id="debtGiveVal" style="color:var(--red);">••••••</div>
        </div>
        <div class="summary-card debt-get clickable" onclick="toggleMask('debtGet')">
          <div class="summary-title">Alacaklarım (Verdiklerim)</div>
          <div class="summary-val masked" id="debtGetVal" style="color:var(--green);">••••••</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-debt-give" onclick="switchDebtTab('debt')">Borçlarım</button>
        <button class="tab-btn" id="tab-debt-get" onclick="switchDebtTab('credit')">Alacaklarım</button>
      </div>
    </div>

    <div id="listContainer"></div>
  </div>

  <button class="fab" onclick="handleFabClick()"><span>+</span></button>

  <!-- BÜTÇE EKLEME MODALI -->
  <div class="modal" id="modalBudget">
    <div class="modal-content">
      <h3 style="margin-bottom: 14px; font-size: 16px;">Kayıt Ekle</h3>
      
      <div class="type-switcher">
        <button type="button" class="type-btn active" id="btnTypeManual" onclick="setModalType('manual')">Diğer</button>
        <button type="button" class="type-btn" id="btnTypeTR" onclick="setModalType('tr')">TR (₺)</button>
        <button type="button" class="type-btn" id="btnTypeIncome" onclick="setModalType('income')">Gelir</button>
      </div>

      <div class="form-group">
        <label>Tarih</label>
        <input type="date" id="mDate">
      </div>
      <div class="form-group">
        <label id="lblAmount">Tutar (€)</label>
        <input type="text" id="mAmount" placeholder="örn: 50,00 €">
      </div>
      <div class="form-group">
        <label id="lblDesc">Kime / Açıklama</label>
        <input type="text" id="mDesc" placeholder="örn: Ev Sahibi / Kira">
      </div>
      <div class="form-group" id="grpCard">
        <label>Hesap / Ödeme Türü</label>
        <input type="text" id="mAccount" placeholder="örn: Sparkasse, Nakit">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-submit" onclick="submitBudgetEntry()">Kaydet</button>
        <button type="button" class="btn-cancel" onclick="closeModal('modalBudget')">Kapat</button>
      </div>
    </div>
  </div>

  <!-- BORÇ EKLEME MODALI -->
  <div class="modal" id="modalDebt">
    <div class="modal-content">
      <h3 style="margin-bottom: 14px; font-size: 16px;">Yeni Borç / Alacak Ekle</h3>
      
      <div class="type-switcher">
        <button type="button" class="type-btn active" id="btnTypeDebtGive" onclick="setDebtModalType('debt')">Borç Aldım</button>
        <button type="button" class="type-btn" id="btnTypeDebtGet" onclick="setDebtModalType('credit')">Borç Verdim</button>
      </div>

      <div class="form-group">
        <label id="lblDebtPerson">Kimden Aldım</label>
        <input type="text" id="mDebtPerson" placeholder="örn: Kardeşim, Ahmet">
      </div>
      <div class="form-group">
        <label>Tarih</label>
        <input type="date" id="mDebtDate">
      </div>
      <div class="form-group">
        <label>Toplam Tutar (€)</label>
        <input type="text" id="mDebtAmount" placeholder="örn: 1.000,00 €">
      </div>
      <div class="form-group">
        <label>Şu Ana Kadar Ödenen (€)</label>
        <input type="text" id="mDebtPaid" placeholder="örn: 0,00 €">
      </div>
      <div class="form-group">
        <label>Durum / Not</label>
        <input type="text" id="mDebtNote" placeholder="örn: Devam Ediyor, Elden">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-submit" onclick="submitDebtEntry()">Kaydet</button>
        <button type="button" class="btn-cancel" onclick="closeModal('modalDebt')">Kapat</button>
      </div>
    </div>
  </div>

  <script>
    const CURRENT_VERSION = "2.0.2";
    const API_URL = "https://script.google.com/macros/s/AKfycbxwsVf8deHomi5jaNLfU86AkVbRQdXPNHuK8z9qiL1EGJanlSo_1e9BhQX0Kup7BdTb/exec";

    let currentModule = 'budget';
    let currentData = null;
    let debtsData = null;
    
    let activeBudgetTab = 'card';
    let activeDebtTab = 'debt';
    let modalSelectedType = 'manual';
    let modalDebtSelectedType = 'debt';
    let memoryCache = {};
    
    let maskedState = {
      rem: true, manual: true, tr: true, inc: true,
      debtNet: true, debtGive: true, debtGet: true
    };

    window.onload = function() {
      checkForAppUpdates();
      document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('mDebtDate').value = new Date().toISOString().split('T')[0];
      initPullToRefresh();
      fetchInitialData();
    };

    async function checkForAppUpdates() {
      try {
        const response = await fetch(window.location.href, { cache: "no-store" });
        const html = await response.text();
        const match = html.match(/CURRENT_VERSION\s*=\s*["']([^"']+)["']/);
        if (match && match[1] && match[1] !== CURRENT_VERSION) {
          localStorage.clear();
          window.location.reload(true);
        }
      } catch (e) {}
    }

    async function fetchInitialData() {
      try {
        const res = await fetch(`${API_URL}?action=getInitialData`);
        const data = await res.json();
        if (data && data.sheets) {
          populateBudgetSheets(data.sheets, data.activeSheet);
          if (data.dashboard) {
            currentData = data.dashboard;
            memoryCache[data.activeSheet || "Mevcut Ay"] = data.dashboard;
            renderDashboard(data.dashboard);
          } else {
            onFilterChange();
          }
        }
      } catch (err) {
        console.error("Veri çekilemedi:", err);
      } finally {
        resetPullIndicator();
      }
    }

    // ==========================================
    // MODÜL GEÇİŞİ (BÜTÇE / BORÇLAR)
    // ==========================================
    function switchModule(mod) {
      currentModule = mod;
      document.getElementById('modBudget').classList.toggle('active', mod === 'budget');
      document.getElementById('modDebts').classList.toggle('active', mod === 'debts');

      document.getElementById('viewBudget').style.display = (mod === 'budget') ? 'block' : 'none';
      document.getElementById('viewDebts').style.display = (mod === 'debts') ? 'block' : 'none';

      const select = document.getElementById('sheetSelect');
      if (mod === 'budget') {
        fetchInitialData();
      } else {
        select.innerHTML = `
          <option value="active" selected>Aktif Borçlar</option>
          <option value="archive">Borçlar Arşiv</option>
        `;
        loadDebtsData();
      }
    }

    function onFilterChange() {
      if (currentModule === 'budget') {
        const sheet = document.getElementById('sheetSelect').value;
        if (!sheet) return;

        if (memoryCache[sheet]) {
          renderDashboard(memoryCache[sheet]);
        } else {
          document.getElementById('cardVal').innerText = "...";
        }

        fetch(`${API_URL}?action=getDashboardData&sheet=${encodeURIComponent(sheet)}`)
          .then(res => res.json())
          .then(data => {
            if (data) {
              memoryCache[sheet] = data;
              renderDashboard(data);
            }
          })
          .catch(err => console.error("Ay verisi alınamadı:", err))
          .finally(() => resetPullIndicator());
      } else {
        loadDebtsData();
      }
    }

    async function loadDebtsData() {
      const isArchive = document.getElementById('sheetSelect').value === 'archive';
      try {
        const res = await fetch(`${API_URL}?action=getDebtsData&archive=${isArchive}`);
        const data = await res.json();
        debtsData = data;
        renderDebtsDashboard(data);
      } catch (e) {
        console.error("Borç verisi alınamadı:", e);
      } finally {
        resetPullIndicator();
      }
    }

    function populateBudgetSheets(sheets, activeSheet) {
      if (currentModule !== 'budget') return;
      const select = document.getElementById('sheetSelect');
      select.innerHTML = '';
      sheets.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        if (name === activeSheet || name === "Mevcut Ay") opt.selected = true;
        select.appendChild(opt);
      });
    }

    function formatAmount(val) {
      if (!val) return "€0,00";
      let str = val.toString().trim();
      if (str.includes("€") || str.includes("₺")) return str;
      let num = parseFloat(str.replace(/\./g, '').replace(',', '.'));
      if (isNaN(num)) return str;
      return "€" + num.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ==========================================
    // BÜTÇE DASHBOARD & LİSTE
    // ==========================================
    function renderDashboard(data) {
      currentData = data;
      if (!data || currentModule !== 'budget') return;
      document.getElementById('cardVal').innerText = data.cardTotal;
      updateMaskedDisplay();
      renderBudgetList();
    }

    function switchBudgetTab(tab) {
      activeBudgetTab = tab;
      document.querySelectorAll('#viewBudget .tab-btn').forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById('tab-' + tab);
      if (target) target.classList.add('active');
      renderBudgetList();
    }

    function renderBudgetList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      if (!currentData || currentModule !== 'budget') return;

      const select = document.getElementById('sheetSelect');
      const isCurrentMonth = (select && select.value === "Mevcut Ay");

      let items = [];
      let isIncome = false;
      let canDelete = isCurrentMonth && (activeBudgetTab === 'manual' || activeBudgetTab === 'income' || activeBudgetTab === 'tr');

      if (activeBudgetTab === 'card') items = currentData.cardItems || [];
      else if (activeBudgetTab === 'manual') items = currentData.manualItems || [];
      else if (activeBudgetTab === 'tr') items = currentData.trItems || [];
      else if (activeBudgetTab === 'income') { items = currentData.incomeItems || []; isIncome = true; }

      if (!items || items.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-dim)">Kayıt bulunamadı.</div>';
        return;
      }

      items.forEach(item => {
        const formattedAmt = formatAmount(item.amount);
        let subText = item.date;
        if (item.card) subText += ` • ${item.card}`;
        if (activeBudgetTab === 'tr' && item.rate) subText += ` • Kur: ${item.rate}`;

        let eurSub = (activeBudgetTab === 'tr' && item.eurAmount) ? `<div class="sub-eur">${item.eurAmount}</div>` : '';
        let itemColor = isIncome ? 'var(--green)' : 'var(--red)';
        let sign = isIncome ? '+' : '-';

        const wrapper = document.createElement('div');
        wrapper.className = canDelete ? 'swipe-container' : '';
        wrapper.id = `item-row-${item.rowIndex}`;

        let deleteAction = canDelete ? `
          <div class="swipe-actions">
            <button class="swipe-btn delete" onclick="deleteBudgetItem('${activeBudgetTab}', ${item.rowIndex})">Sil</button>
          </div>
        ` : '';

        wrapper.innerHTML = `
          ${deleteAction}
          <div class="item-card">
            <div class="item-left">
              <div class="name">${item.merchant || 'Açıklamasız'}</div>
              <div class="sub">${subText}</div>
            </div>
            <div class="item-right" style="color: ${itemColor}">
              ${sign}${formattedAmt}
              ${eurSub}
            </div>
          </div>
        `;

        if (canDelete) attachSwipeEvents(wrapper.querySelector('.item-card'), wrapper);
        container.appendChild(wrapper);
      });
    }

    // ==========================================
    // BORÇLAR DASHBOARD & LİSTE
    // ==========================================
    function renderDebtsDashboard(data) {
      if (!data || currentModule !== 'debts') return;
      updateMaskedDisplay();
      renderDebtsList();
    }

    function switchDebtTab(tab) {
      activeDebtTab = tab;
      document.querySelectorAll('#viewDebts .tab-btn').forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(tab === 'debt' ? 'tab-debt-give' : 'tab-debt-get');
      if (target) target.classList.add('active');
      renderDebtsList();
    }

    function renderDebtsList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      if (!debtsData || currentModule !== 'debts') return;

      const isArchive = document.getElementById('sheetSelect').value === 'archive';
      let items = (activeDebtTab === 'debt') ? debtsData.debts : debtsData.credits;

      if (!items || items.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-dim)">Kayıt bulunamadı.</div>';
        return;
      }

      items.forEach(item => {
        const total = formatAmount(item.totalAmount);
        const rem = formatAmount(item.remainingAmount);
        const paid = formatAmount(item.paidAmount);

        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-container';
        wrapper.id = `debt-row-${item.rowIndex}`;

        let swipeButtons = '';
        if (!isArchive) {
          swipeButtons = `
            <div class="swipe-actions">
              <button class="swipe-btn pay" onclick="handleDebtPayment('${activeDebtTab}', ${item.rowIndex})">Ödeme</button>
              <button class="swipe-btn close" onclick="handleDebtArchive('${activeDebtTab}', ${item.rowIndex})">Kapat</button>
              <button class="swipe-btn delete" onclick="handleDebtDelete('${activeDebtTab}', ${item.rowIndex})">Sil</button>
            </div>
          `;
        } else {
          swipeButtons = `
            <div class="swipe-actions">
              <button class="swipe-btn delete" onclick="handleDebtDelete('${activeDebtTab}', ${item.rowIndex})">Sil</button>
            </div>
          `;
        }

        wrapper.innerHTML = `
          ${swipeButtons}
          <div class="item-card">
            <div class="item-left">
              <div class="name">${item.person}</div>
              <div class="sub">${item.date} • ${item.statusOrDate || ''} (Ödenen: ${paid})</div>
            </div>
            <div class="item-right" style="color: ${activeDebtTab === 'debt' ? 'var(--red)' : 'var(--green)'}">
              ${total}
              <div class="sub-eur">Kalan: ${rem}</div>
            </div>
          </div>
        `;

        attachSwipeEvents(wrapper.querySelector('.item-card'), wrapper);
        container.appendChild(wrapper);
      });
    }

    // ==========================================
    // MASKELEME (GİZLE / GÖSTER)
    // ==========================================
    function toggleMask(key) {
      maskedState[key] = !maskedState[key];
      updateMaskedDisplay();
    }

    function updateMaskedDisplay() {
      if (currentModule === 'budget' && currentData) {
        const remEl = document.getElementById('remVal');
        if (maskedState.rem) {
          remEl.innerText = "••••••"; remEl.classList.add('masked'); remEl.style.color = "";
        } else {
          remEl.innerText = currentData.remaining; remEl.classList.remove('masked');
          remEl.style.color = (currentData.remaining || "").toString().includes("-") ? "var(--red)" : "var(--green)";
        }

        const manEl = document.getElementById('manualVal');
        manEl.innerText = maskedState.manual ? "••••••" : currentData.manualTotal;
        manEl.classList.toggle('masked', maskedState.manual);

        const trEl = document.getElementById('trVal');
        trEl.innerText = maskedState.tr ? "••••••" : (currentData.trTotal || "€0,00");
        trEl.classList.toggle('masked', maskedState.tr);

        const incEl = document.getElementById('incVal');
        incEl.innerText = maskedState.inc ? "••••••" : currentData.incomeTotal;
        incEl.classList.toggle('masked', maskedState.inc);
      } 
      else if (currentModule === 'debts' && debtsData) {
        const netEl = document.getElementById('debtNetVal');
        if (maskedState.debtNet) {
          netEl.innerText = "••••••"; netEl.classList.add('masked'); netEl.style.color = "";
        } else {
          netEl.innerText = debtsData.netBalance; netEl.classList.remove('masked');
          netEl.style.color = (debtsData.netBalance || "").toString().includes("-") ? "var(--red)" : "var(--green)";
        }

        const giveEl = document.getElementById('debtGiveVal');
        giveEl.innerText = maskedState.debtGive ? "••••••" : debtsData.totalDebt;
        giveEl.classList.toggle('masked', maskedState.debtGive);

        const getEl = document.getElementById('debtGetVal');
        getEl.innerText = maskedState.debtGet ? "••••••" : debtsData.totalCredit;
        getEl.classList.toggle('masked', maskedState.debtGet);
      }
    }

    // ==========================================
    // SWIPE (KAYDIRMA) MOTORU
    // ==========================================
    let currentlySwiped = null;
    let currentlySwipedContainer = null;

    function attachSwipeEvents(card, container) {
      let startX = 0;
      let currentX = 0;

      card.addEventListener('touchstart', e => {
        if (currentlySwiped && currentlySwiped !== card) {
          currentlySwiped.style.transform = 'translateX(0px)';
          if (currentlySwipedContainer) currentlySwipedContainer.classList.remove('swiped', 'swiping');
          currentlySwiped = null; currentlySwipedContainer = null;
        }
        startX = e.touches[0].clientX;
      }, { passive: true });

      card.addEventListener('touchmove', e => {
        currentX = e.touches[0].clientX;
        let diff = currentX - startX;
        if (diff < 0 && diff > -180) {
          container.classList.add('swiping');
          card.style.transform = `translateX(${diff}px)`;
        }
      }, { passive: true });

      card.addEventListener('touchend', () => {
        let diff = currentX - startX;
        let maxOffset = (currentModule === 'debts' && document.getElementById('sheetSelect').value !== 'archive') ? -160 : -80;
        if (diff < -50) {
          card.style.transform = `translateX(${maxOffset}px)`;
          container.classList.add('swiped');
          container.classList.remove('swiping');
          currentlySwiped = card; currentlySwipedContainer = container;
        } else {
          card.style.transform = 'translateX(0px)';
          container.classList.remove('swiped', 'swiping');
          if (currentlySwiped === card) { currentlySwiped = null; currentlySwipedContainer = null; }
        }
      });
    }

    // ==========================================
    // BORÇLAR İŞLEM FONKSİYONLARI
    // ==========================================
    async function handleDebtPayment(debtType, rowIndex) {
      const pay = prompt("Eklemek istediğiniz ödeme tutarını girin (€):");
      if (!pay) return;

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'updateDebtPayment',
          debtType: debtType,
          rowIndex: rowIndex,
          amount: pay
        })
      });
      loadDebtsData();
    }

    async function handleDebtArchive(debtType, rowIndex) {
      if (!confirm("Bu borç/alacak kapandı olarak arşive taşınsın mı?")) return;

      const row = document.getElementById(`debt-row-${rowIndex}`);
      if (row) row.remove();

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'archiveDebt',
          debtType: debtType,
          rowIndex: rowIndex
        })
      });
      loadDebtsData();
    }

    async function handleDebtDelete(debtType, rowIndex) {
      if (!confirm("Bu kaydı tamamen silmek istediğinize emin misiniz?")) return;
      const isArchive = document.getElementById('sheetSelect').value === 'archive';

      const row = document.getElementById(`debt-row-${rowIndex}`);
      if (row) row.remove();

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'deleteDebt',
          debtType: debtType,
          rowIndex: rowIndex,
          isArchive: isArchive
        })
      });
      loadDebtsData();
    }

    async function deleteBudgetItem(type, rowIndex) {
      const sheet = document.getElementById('sheetSelect').value;
      const row = document.getElementById(`item-row-${rowIndex}`);
      if (row) row.remove();

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'deleteEntry',
          sheet: sheet,
          type: type,
          rowIndex: rowIndex
        })
      });
      delete memoryCache[sheet];
      onFilterChange();
    }

    // ==========================================
    // PULL TO REFRESH
    // ==========================================
    let touchStartY = 0;
    let isPulling = false;
    let pullIndicator = null;
    let appContent = null;

    function initPullToRefresh() {
      pullIndicator = document.getElementById('pullIndicator');
      appContent = document.getElementById('appContent');

      document.addEventListener('touchstart', e => {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (scrollTop <= 5) {
          touchStartY = e.touches[0].clientY;
          isPulling = true;
        } else {
          isPulling = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', e => {
        if (!isPulling || touchStartY === 0) return;
        let currentY = e.touches[0].clientY;
        let distance = currentY - touchStartY;

        if (distance > 0) {
          let pullOffset = Math.min(80, distance * 0.45);
          appContent.style.transform = `translateY(${pullOffset}px)`;
          let scale = Math.min(1, distance / 70);
          pullIndicator.style.opacity = scale;
          pullIndicator.style.transform = `translateX(-50%) scale(${scale})`;
          pullIndicator.innerHTML = '↓';
        }
      }, { passive: true });

      document.addEventListener('touchend', e => {
        if (!isPulling || touchStartY === 0) return;
        let touchEndY = e.changedTouches[0].clientY;
        let distance = touchEndY - touchStartY;

        if (distance > 70) {
          appContent.style.transform = 'translateY(60px)';
          pullIndicator.innerHTML = '↻';
          pullIndicator.classList.add('rotating');
          onFilterChange();
        } else {
          resetPullIndicator();
        }
        touchStartY = 0;
        isPulling = false;
      }, { passive: true });
    }

    function resetPullIndicator() {
      if (!pullIndicator) return;
      if (appContent) appContent.style.transform = 'translateY(0px)';
      pullIndicator.classList.remove('rotating');
      pullIndicator.style.opacity = '0';
      pullIndicator.style.transform = 'translateX(-50%) scale(0)';
      pullIndicator.innerHTML = '↓';
    }

    // ==========================================
    // MODAL & KAYIT EKLEME
    // ==========================================
    function handleFabClick() {
      if (currentModule === 'budget') {
        document.getElementById('modalBudget').style.display = 'flex';
      } else {
        document.getElementById('modalDebt').style.display = 'flex';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function setModalType(type) {
      modalSelectedType = type;
      document.querySelectorAll('#modalBudget .type-btn').forEach(b => b.classList.remove('active'));
      const lblAmount = document.getElementById('lblAmount');
      const lblDesc = document.getElementById('lblDesc');
      const grpCard = document.getElementById('grpCard');
      const mDesc = document.getElementById('mDesc');
      const mAmount = document.getElementById('mAmount');

      if (type === 'income') {
        document.getElementById('btnTypeIncome').classList.add('active');
        lblDesc.innerText = 'Nereden / Açıklama';
        lblAmount.innerText = 'Tutar (€)';
        mAmount.placeholder = 'örn: 500,00 €';
        mDesc.placeholder = 'örn: Maaş, Prim vb.';
        grpCard.style.display = 'none';
      } else if (type === 'tr') {
        document.getElementById('btnTypeTR').classList.add('active');
        lblDesc.innerText = 'Nereye / Açıklama';
        lblAmount.innerText = 'Tutar (₺)';
        mAmount.placeholder = 'örn: 500,00 ₺';
        mDesc.placeholder = 'örn: Spotify, Enpara';
        grpCard.style.display = 'none';
      } else {
        document.getElementById('btnTypeManual').classList.add('active');
        lblDesc.innerText = 'Kime / Açıklama';
        lblAmount.innerText = 'Tutar (€)';
        mAmount.placeholder = 'örn: 50,00 €';
        mDesc.placeholder = 'örn: Ev Sahibi / Kira';
        grpCard.style.display = 'block';
      }
    }

    function setDebtModalType(type) {
      modalDebtSelectedType = type;
      document.querySelectorAll('#modalDebt .type-btn').forEach(b => b.classList.remove('active'));
      const lblPerson = document.getElementById('lblDebtPerson');

      if (type === 'debt') {
        document.getElementById('btnTypeDebtGive').classList.add('active');
        lblPerson.innerText = 'Kimden Borç Aldım';
      } else {
        document.getElementById('btnTypeDebtGet').classList.add('active');
        lblPerson.innerText = 'Kime Borç Verdim';
      }
    }

    async function submitBudgetEntry() {
      const type = modalSelectedType;
      const rawDate = document.getElementById('mDate').value;
      let dateFormatted = "";
      if (rawDate) {
        const p = rawDate.split("-");
        dateFormatted = `${p[2]}.${p[1]}.${p[0]}`;
      }

      const payload = {
        date: dateFormatted,
        amount: document.getElementById('mAmount').value,
        merchant: document.getElementById('mDesc').value,
        card: document.getElementById('mAccount').value
      };

      closeModal('modalBudget');
      document.getElementById('mAmount').value = '';
      document.getElementById('mDesc').value = '';
      document.getElementById('mAccount').value = '';

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'addEntry',
          sheet: document.getElementById('sheetSelect').value,
          type: type,
          payload: payload
        })
      });
      onFilterChange();
    }

    async function submitDebtEntry() {
      const rawDate = document.getElementById('mDebtDate').value;
      let dateFormatted = "";
      if (rawDate) {
        const p = rawDate.split("-");
        dateFormatted = `${p[2]}.${p[1]}.${p[0]}`;
      }

      const payload = {
        person: document.getElementById('mDebtPerson').value,
        date: dateFormatted,
        amount: document.getElementById('mDebtAmount').value,
        paid: document.getElementById('mDebtPaid').value,
        note: document.getElementById('mDebtNote').value
      };

      closeModal('modalDebt');
      document.getElementById('mDebtPerson').value = '';
      document.getElementById('mDebtAmount').value = '';
      document.getElementById('mDebtPaid').value = '';
      document.getElementById('mDebtNote').value = '';

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'addDebt',
          debtType: modalDebtSelectedType,
          payload: payload
        })
      });
      loadDebtsData();
    }
  </script>
